<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title و Description بهینه شده با محل -->
    <title>کافه جلاتو کرج | Gelato Cafe</title>
    <meta
      name="description"
      content="کافه جلاتو کرج – بستنی ایتالیایی تازه، دسرهای خاص، سفارش آنلاین و ارسال سریع در کرج. تجربه واقعی جلاتو با بهترین طعم‌ها."
    />
    <meta
      name="keywords"
      content="ژلاتو, بستنی, Gelato, بستنی ایتالیایی, بستنی سنتی, سفارش بستنی, دسر, شیرینی, بستنی آنلاین, کافه جلاتو کرج, کرج, ملاصدرا"
    />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="fa" />
    <meta name="author" content="Gelato Cafe Team" />

    <!-- Canonical -->
    <link rel="canonical" href="https://gelatocafe.ir/" />

    <!-- Open Graph (برای شبکه‌های اجتماعی) -->
    <meta property="og:title" content="کافه جلاتو کرج | Gelato Cafe" />
    <meta
      property="og:description"
      content="تجربه واقعی ژلاتو ایتالیایی در کرج. سفارش آنلاین بستنی تازه با ارسال سریع."
    />
    <meta property="og:url" content="https://gelatocafe.ir/" />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://gelatocafe.ir/images/Banner.png"
    />
    <meta property="og:locale" content="fa_IR" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="کافه جلاتو کرج | Gelato Cafe" />
    <meta
      name="twitter:description"
      content="کافه جلاتو کرج – بستنی‌های تازه و لذیذ با طعم واقعی ژلاتو. سفارش آنلاین."
    />
    <meta
      name="twitter:image"
      content="https://gelatocafe.ir/images/Banner.png"
    />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#ff66aa" />

    <!-- Favicon استاندارد -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon/favicon-16x16.png"
    />
    <link rel="shortcut icon" href="/favicon/favicon.ico" type="image/x-icon" />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- فونت آیکون‌ها -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
